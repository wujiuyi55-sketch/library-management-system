# 生产 / 本地 MySQL 环境
# 启动：java -jar library-management-system.jar --spring.profiles.active=mysql
# 数据库连接信息全部走环境变量，不要把密码写进代码仓库
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:library}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
  sql:
    init:
      # 生产环境不自动建表：先手动执行 db/schema-mysql.sql 和 db/data.sql
      mode: never
  h2:
    console:
      enabled: false
